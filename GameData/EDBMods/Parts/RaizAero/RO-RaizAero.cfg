@PART[EDB-Tomato]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/RaizAero/Tomato
		scale = 1,1,1
	}
	
	@scale = 1.0

	RESOURCE
	{
		name = Water
		amount = 0
		maxAmount = 1.875
	}
	RESOURCE
	{
		name = WasteWater
		amount = 0
		maxAmount = 1.25
	}
	RESOURCE
	{
		name = Tomatoes
		amount = 0
		maxAmount = 1.2
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Tomatoes
		 StartActionName = Start Growth
		 StopActionName = Stop Growth
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false

		 INPUT_RESOURCE
		 {
			ResourceName = Water
			Ratio = 0.000069
		 }	
		OUTPUT_RESOURCE
		{
			ResourceName = Tomatoes
			Ratio = 0.0000035
			DumpExcess = false
		}
		OUTPUT_RESOURCE
		{
			ResourceName = WasteWater
			Ratio = 0.00000115
			DumpExcess = false
		}		
		
	}	
}

